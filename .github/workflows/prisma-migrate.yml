name: Run Prisma Migrations

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install (web)
        run: |
          cd web
          npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd web
          npx prisma generate

      - name: Apply Prisma schema (db push)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd web
          # If migrations are not present, use db push to apply the schema
          npx prisma db push --accept-data-loss

      - name: Seed database (JobSource entries)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd web
          node prisma/seed.js

      - name: Finished
        run: echo "Schema applied and seeding completed"
