name: Run Prisma Migrations

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install (web)
        run: |
          cd web
          npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd web
          npx prisma generate

      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd web
          npx prisma migrate deploy

      - name: Seed database (JobSource entries)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd web
          node prisma/seed.js

      - name: Finished
        run: echo "Migrations and seeding completed"
